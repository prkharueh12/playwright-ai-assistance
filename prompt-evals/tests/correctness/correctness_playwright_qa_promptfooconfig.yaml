# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Answer correctness — known-good Playwright Q&A checked against a reference"

prompts:
  - "{{query}}"

providers:
  - id: file://../../providers/gemini-rag-provider.ts
    label: gemini-rag-provider

defaultTest:
  options:
    provider: google:gemini-3.1-flash-lite
    # Domain-specific grading philosophy layered on top of each case's own
    # `value` rubric below (the {{ rubric }} var in this file).
    rubricPrompt: file://../../prompts/correctness_grading_rules.txt

# Handwritten — each case needs a known-good reference, so this isn't
# auto-generated. Per the eval skill's rule, the reference material is
# inlined directly in each rubric (the grader only sees vars in the rubric
# text itself, never other test fields).
tests:
  - description: "Locator API — selecting a button by its accessible role"
    vars:
      query: "How do I select a button with the text 'Submit' using Playwright's recommended locator API?"
    assert:
      - type: llm-rubric
        value: |
          The user is asking how to select a button by its text using
          Playwright's recommended approach. Per Playwright's documented
          best practice, `getByRole` (e.g. `page.getByRole('button', { name:
          'Submit' })`) is the recommended role-based locator for this case.

          PASS: The answer recommends getByRole (or an equivalent role-based
          locator) as the primary approach.
          FAIL: The answer recommends a raw CSS/XPath selector as the
          primary approach, or confuses the locator with an assertion
          method.

  - description: "Auto-waiting after a navigating click"
    vars:
      query: "After clicking a link that navigates to a new page, do I need to manually wait for navigation to complete before asserting on the new page in Playwright?"
    assert:
      - type: llm-rubric
        value: |
          The user is asking whether they need to manually wait for
          navigation before asserting on a new page. Per Playwright's
          auto-waiting behavior, locator actions and web-first assertions
          already wait for the right state — a manual wait is only needed
          for edge cases like popups or non-standard navigation.

          PASS: The answer states that Playwright auto-waits and a manual
          wait usually isn't required for the common case.
          FAIL: The answer says a manual wait (e.g. waitForNavigation) is
          required by default, or fails to mention auto-waiting at all.

  - description: "Anti-pattern: waitForTimeout for element visibility"
    vars:
      query: "Should I use page.waitForTimeout(5000) to wait for an element to become visible before interacting with it in Playwright?"
    assert:
      - type: llm-rubric
        value: |
          The user is asking whether a hardcoded timeout is the right way
          to wait for an element to become visible. Per Playwright's own
          documentation, `page.waitForTimeout()` is explicitly discouraged
          for this — it's an arbitrary, flaky hard wait. The recommended
          approach is to rely on auto-waiting locators (e.g.
          `page.getByRole(...).click()`) or an explicit `waitFor()`/
          web-first assertion, which wait for the actual condition instead
          of a fixed duration.

          PASS: The answer advises against using waitForTimeout for this
          purpose and recommends auto-waiting locators or an explicit wait
          condition instead.
          FAIL: The answer recommends waitForTimeout as a good or
          acceptable solution here, or doesn't mention its drawbacks
          (flakiness, arbitrary duration).
