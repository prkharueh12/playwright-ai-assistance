name: Prompt evals

on:
  schedule:
    # Weekly, Monday 07:00 UTC — offset an hour from refresh-docs.yml's
    # 06:00 slot so the two don't contend for a runner at the same minute.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: "Also run the benchmark suite (3x the API calls per case, across Gemini/OpenAI/Anthropic)"
        type: boolean
        default: false

jobs:
  # Runs on both the weekly schedule and manual dispatch. Cheap enough
  # (single Gemini provider) to run automatically. Auto-discovers every
  # *_promptfooconfig.yaml under prompt-evals/tests/ EXCEPT benchmark/ (that
  # one lives in its own job below, manual-dispatch-only) — adding a new
  # suite here, even in a brand new category folder, needs no edit to this
  # file, as long as it only needs GOOGLE_API_KEY.
  correctness-and-refusal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run all suites
        id: run-suites
        # Informational only — a failing suite here shouldn't fail the
        # build. Thresholds/rubrics aren't calibrated as a hard gate yet.
        continue-on-error: true
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          shopt -s globstar
          mkdir -p eval-results
          paths=()
          for config in prompt-evals/tests/**/*_promptfooconfig.yaml; do
            case "$config" in
              */benchmark/*) continue ;;
            esac
            name=$(basename "$config" _promptfooconfig.yaml)
            out="eval-results/${name}.json"
            out_html="eval-results/${name}.html"
            echo "Running $config -> $out"
            npx promptfoo eval -c "$config" -o "$out" "$out_html" || true
            paths+=("$out")
          done
          IFS=,
          echo "paths=${paths[*]}" >> "$GITHUB_OUTPUT"

      # Interactive per-suite HTML reports (full prompt/response/assertion
      # detail) — kept as a private GitHub Actions artifact rather than
      # promptfoo's own hosted "share" feature, which would upload eval
      # data to a third-party service. Runs before the report steps below
      # so its artifact-url output is available to pass into them.
      - name: Upload eval reports
        id: upload-reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-correctness-and-refusal
          path: eval-results/*.html
          retention-days: 14

      # One combined report across every suite that ran — each suite is its
      # own row rather than its own separate message.
      - name: Write job summary
        if: always()
        env:
          RESULTS_JSON_PATHS: ${{ steps.run-suites.outputs.paths }}
          ARTIFACT_URL: ${{ steps.upload-reports.outputs.artifact-url }}
        run: npm run write:summary

      - name: Notify Slack
        if: always()
        env:
          RESULTS_JSON_PATHS: ${{ steps.run-suites.outputs.paths }}
          ARTIFACT_URL: ${{ steps.upload-reports.outputs.artifact-url }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run notify:slack

  # Manual-trigger-only, AND opt-in even then: 3x the API calls per case
  # (Gemini + OpenAI + Anthropic), and thresholds are still unmeasured
  # guesses — not something to run by default just because someone clicked
  # "Run workflow". The run_benchmark checkbox defaults to unchecked, so a
  # plain manual dispatch skips this job. Same auto-discovery as the other
  # job, scoped to tests/benchmark/ only.
  benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmark == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run all suites
        id: run-suites
        continue-on-error: true
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          shopt -s globstar
          mkdir -p eval-results
          paths=()
          for config in prompt-evals/tests/benchmark/**/*_promptfooconfig.yaml; do
            name=$(basename "$config" _promptfooconfig.yaml)
            out="eval-results/${name}.json"
            out_html="eval-results/${name}.html"
            echo "Running $config -> $out"
            # --no-cache is required: promptfoo's latency assertion errors
            # on cached results, since there's no wall-clock time to measure.
            npx promptfoo eval -c "$config" --no-cache -o "$out" "$out_html" || true
            paths+=("$out")
          done
          IFS=,
          echo "paths=${paths[*]}" >> "$GITHUB_OUTPUT"

      - name: Upload eval reports
        id: upload-reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-benchmark
          path: eval-results/*.html
          retention-days: 14

      - name: Write job summary
        if: always()
        env:
          RESULTS_JSON_PATHS: ${{ steps.run-suites.outputs.paths }}
          ARTIFACT_URL: ${{ steps.upload-reports.outputs.artifact-url }}
        run: npm run write:summary

      - name: Notify Slack
        if: always()
        env:
          RESULTS_JSON_PATHS: ${{ steps.run-suites.outputs.paths }}
          ARTIFACT_URL: ${{ steps.upload-reports.outputs.artifact-url }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run notify:slack
