name: Refresh Playwright docs index

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run ingestion pipeline
        run: npm run ingest

      - name: Commit updated index if changed
        run: |
          if git diff --quiet -- data/embeddings/index.json; then
            echo "No changes to the embeddings index."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/embeddings/index.json
          git commit -m "chore: refresh Playwright docs embeddings index"
          git push
